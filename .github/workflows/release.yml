name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.repository == 'vevani/fast-meraki-mcp-server'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pip install pytest pytest-asyncio pytest-httpx
        pytest tests/ -v

    - name: Validate server functionality
      run: |
        python -c "import meraki_mcp_server; print('✓ Server module validated')"

    - name: Extract tag version
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release Notes
      id: release_notes
      run: |
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
        echo "# Fast Meraki MCP Server ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "## Features" >> $GITHUB_OUTPUT
        echo "- Semantic FastMCP server for Cisco Meraki API integration" >> $GITHUB_OUTPUT
        echo "- AI-powered tool discovery and null-safe response processing" >> $GITHUB_OUTPUT
        echo "- Python 3.12+ support with comprehensive CI/CD pipeline" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "## Installation" >> $GITHUB_OUTPUT
        echo "\`\`\`bash" >> $GITHUB_OUTPUT
        echo "git clone https://github.com/vevani/fast-meraki-mcp-server.git" >> $GITHUB_OUTPUT
        echo "cd fast-meraki-mcp-server" >> $GITHUB_OUTPUT
        echo "pip install -r requirements.txt" >> $GITHUB_OUTPUT
        echo "\`\`\`" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "## Requirements" >> $GITHUB_OUTPUT
        echo "- Python 3.12+" >> $GITHUB_OUTPUT
        echo "- Meraki API Key" >> $GITHUB_OUTPUT
        echo "- FastMCP 2.10.6+" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        release_name: Fast Meraki MCP Server ${{ steps.get_version.outputs.VERSION }}
        body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
        draft: false
        prerelease: false

    - name: Upload Release Asset (Source Code)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./meraki_mcp_server.py
        asset_name: meraki_mcp_server.py
        asset_content_type: text/plain